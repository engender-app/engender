<!doctype html>
<html lang="en" data-palette="trans" data-mood-preset="teal" data-theme="light" data-a11y-text-size="normal" data-a11y-legibility="normal" data-a11y-motion="normal">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report anything
         but 0. Without it the browser letterboxes the page inside the display
         cutout and the insets read as zero everywhere, so the layout below has
         nothing to consume - which is the shell defect SCREENS.md records
         (phase 5 ticket 18). It also means the page now extends under the
         status and navigation bars on all four sides, so app.css pads the
         scroll region back off every one of them rather than only the bottom. -->
    <!-- No maximum-scale, no user-scalable: the browser's zoom belongs to
         the person using the app (WCAG 1.4.4, audit U2). The Android shell
         is the exception - it turns pinch off in the WebView itself, via
         capacitor.config.ts's zoomEnabled - so this markup serves the web
         release only where zoom is wanted. tests/zoom-policy.test.ts holds
         both halves of that policy to their sources. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F4F8FB" />
    <!-- Both above the script below, which swaps them for their neutral
         counterparts when the app is disguised (F24). The order matters: the
         script can only reach an element the parser has already seen, and the
         swap has to happen in the same parse tick - before the tab paints a
          flag, and before anything later in boot can still leave the real
          manifest linked for an install prompt or launcher refresh to read.

         Production hosting has to map the .webmanifest extension to
         application/manifest+json; nginx's default mime.types does not. -->
    <link rel="icon" href="%sveltekit.assets%/favicon-trans.svg" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <script>
      /* Stamps the user's theme, palette and tab icon before first paint
         (ADR-0009).
         The attributes on <html> above are only what a first-ever visit,
         or a visit where this throws, falls back to; SQLite is still
         hundreds of milliseconds from opening at this point, which is why
         these preferences are mirrored outside it at all.

         Inline and dependency-free because it has to run before any module
         is parsed, so it cannot import the key or the shape - both are
         owned by src/lib/data/prefs/boot-cache.ts and have to be changed
         in the two places together. */
      try {
        const boot = JSON.parse(localStorage.getItem('engender-boot-prefs') || '{}');
        const root = document.documentElement;
        if (boot.palette) root.dataset.palette = boot.palette;
        if (boot.moodPreset) root.dataset.moodPreset = boot.moodPreset;
        root.dataset.theme =
          !boot.theme || boot.theme === 'system'
            ? matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : boot.theme;
        /* Under disguise the first frame carries no mark, the same rule every
           surface that draws it follows (ADR-0014): the ground alone. */
        if (boot.disguise) root.dataset.disguised = '';
        root.dataset.a11yTextSize = boot.a11yTextSizeBoost ? 'boost' : 'normal';
        root.dataset.a11yLegibility = boot.a11yLegibilityBoost ? 'boost' : 'normal';
        root.dataset.a11yMotion = boot.a11yMotionReduce || matchMedia('(prefers-reduced-motion: reduce)').matches
          ? 'reduce'
          : 'normal';
        /* The tab icon, which is the mark in the flag the person picked
           (ticket 50), and under disguise the neutral one instead. Set on
           every boot rather than only a disguised one: the document ships
           pointing at the default palette's file, so a person on any other
           flag would otherwise wear trans in the tab strip until the
           layout's effect ran.

           Disguise is the half of this that cannot wait for that effect:
           by then the flag icon has already been in the tab strip for as
           long as boot takes, and an install started in that window would
           have taken the app's real name with it. Both hrefs are derived
           from the links above rather than written out again, so the asset
           paths live in one place. */
        const icon = document.querySelector('link[rel="icon"]');
        icon.href = icon.href.replace(
          'favicon-trans.svg',
          'favicon-' + (boot.disguise ? 'notes' : boot.palette || 'trans') + '.svg'
        );
        const manifest = document.querySelector('link[rel="manifest"]');
        if (boot.disguise) {
          manifest.href = manifest.href.replace('manifest.webmanifest', 'manifest-notes.webmanifest');
          const touchIcon = document.querySelector('link[rel="apple-touch-icon"]');
          if (touchIcon) touchIcon.href = touchIcon.href.replace('apple-touch-icon.png', 'apple-touch-icon-notes.png');
        }
        const savedLocale = localStorage.getItem('PARAGLIDE_LOCALE');
        const locale = savedLocale === 'en' || savedLocale === 'pl' ? savedLocale : navigator.language;
        if (locale.toLowerCase().startsWith('pl')) {
          manifest.href = manifest.href.replace('.webmanifest', '-pl.webmanifest');
        }
      } catch {
        /* no mirror yet, or storage is unavailable */
      }
      /* The build leaves the document's module hints inert (rel="x-modulepreload",
         src/hooks.server.ts) so the stylesheets a first paint waits for are
         not sharing the connection with ninety-eight modules nothing waits
         for. They are given back once the document has parsed and the first
         frame has had its turn. Outside the try above, so a browser with no
         storage still loads its modules. */
      addEventListener('DOMContentLoaded', () => {
        requestAnimationFrame(() =>
          setTimeout(() => {
            for (const link of document.querySelectorAll('link[rel="x-modulepreload"]')) link.rel = 'modulepreload';
          })
        );
      });
    </script>
    <style>
      /* The first frame (phase 14 pre-release ticket 13): the ground and the
         mark, painted from this document alone. Everything the app draws
         waits for its scripts, which on a slow phone is seconds, so until
         then the page was white. The theme and palette are the ones the
         script above has just stamped on <html>; the colours per palette
         are generated into the block below from palettes.css
         (npm run render:splash), and src/lib/theme/splash.ts says how.

         The mark never moves. The handover is opacity only: lib/splash.ts
         adds .is-leaving when the app mounts and .is-answered once boot has
         answered, and takes the element out when the fade is done. It is fixed and inert, so nothing under it
         can be missed or blocked, and the ground is the app's own --bg so no
         frame of the fade shows a different one. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        pointer-events: none;
        background: var(--splash-ground, #f4f8fb);
        transition: opacity 280ms cubic-bezier(0.2, 0, 0, 1);
      }
      #splash i {
        --s: 96px;
        display: block;
        box-sizing: border-box;
        width: var(--s);
        height: var(--s);
        border-radius: var(--splash-radius);
        background: radial-gradient(circle var(--s) at 100% 0, var(--splash-rings, var(--splash-tile), var(--splash-tile))), var(--splash-tile);
      }
      /* The tile's black edge, drawn the way mark.ts draws it: a stroke on
         the tile's own outline. It is also an element the browser counts as
         content, which is what lets the first frame be the page's first
         contentful paint and not only its first paint. */
      #splash svg { display: block; width: 100%; height: 100%; }
      #splash rect { stroke: var(--splash-ink); }
      #splash.is-leaving { opacity: 0; }
      html[data-disguised] #splash i { display: none; }
      /* The other handover on the table: the ground lets go as the app
         mounts, so the screen arrives around the mark, and the mark stays
         until boot has answered and then fades. */
      html[data-splash-handover='lead'] #splash {
        transition: background-color 260ms cubic-bezier(0.2, 0, 0, 1);
      }
      html[data-splash-handover='lead'] #splash i {
        transition: opacity 200ms cubic-bezier(0.2, 0, 0, 1);
      }
      html[data-splash-handover='lead'] #splash.is-leaving { opacity: 1; background-color: transparent; }
      html[data-splash-handover='lead'] #splash.is-answered i { opacity: 0; }
