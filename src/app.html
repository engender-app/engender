<!doctype html>
<html lang="en" data-splash data-palette="trans" data-mood-preset="teal" data-theme="light" data-a11y-text-size="normal" data-a11y-legibility="normal" data-a11y-motion="normal">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover makes the browser report the safe-area insets and
         lets the page extend behind the system bars. app.css uses the
         insets to pad the scroll region on all four sides. -->
    <!-- No maximum-scale, no user-scalable: the browser's zoom belongs to the person using
         the app (WCAG 1.4.4). The Android shell is the exception - it turns pinch off in
         the WebView itself, via capacitor.config.ts's zoomEnabled - so this markup serves
         the web release only where zoom is wanted. tests/node/ui/zoom-policy.test.ts holds
         both halves of that policy to their sources. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F4F8FB" />
    <!-- Both above the script below, which swaps them for their neutral
         counterparts when the app is disguised (F24). The order matters: the
         script can only reach an element the parser has already seen, and the
         swap has to happen in the same parse tick - before the tab paints a
          flag, and before anything later in boot can still leave the real
          manifest linked for an install prompt or launcher refresh to read.

         Production hosting has to map the .webmanifest extension to
         application/manifest+json; nginx's default mime.types does not. -->
    <link rel="icon" href="%sveltekit.assets%/favicon-trans.svg" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <script>
      /* Stamps the user's theme, palette and tab icon before first paint. The attributes on
         <html> above are only what a first-ever visit, or a visit where this throws, falls
         back to; SQLite is still hundreds of milliseconds from opening at this point, which
         is why these preferences are mirrored outside it at all.

         Inline and dependency-free because it has to run before any module is parsed, so it
         cannot import the key or the shape - both are owned by
         src/lib/data/prefs/boot-cache.ts and have to be changed in the two places together. */
      try {
        let boot = {};
        try {
          boot = JSON.parse(localStorage.getItem('engender-boot-prefs') || '{}');
          if (!boot || typeof boot !== 'object') boot = {};
        } catch {
          /* unreadable storage or a damaged mirror: the shell's answer below still applies */
        }
        /* The Android shell's live alias outranks the mirror: the disguise
           flip kills the process before the mirror is flushed to disk, so
           the first start after a flip would otherwise read the old state.
           Same read as nativeDisguise() in boot-cache.ts. */
        try {
          if (window.androidDisguiseState) boot.disguise = window.androidDisguiseState.isDisguised() === true;
        } catch {}
        const root = document.documentElement;
        /* Disguised, the first frame and every gate wear the neutral notes palette,
           whatever an older mirror still names. Same rule as documentChrome.ts before the
           journal shows. */
        if (boot.disguise) root.dataset.palette = 'notes';
        else if (boot.palette) root.dataset.palette = boot.palette;
        if (boot.moodPreset) root.dataset.moodPreset = boot.moodPreset;
        root.dataset.theme =
          !boot.theme || boot.theme === 'system'
            ? matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : boot.theme;
        /* Under disguise the first frame carries no mark, the same rule every surface that
           draws it follows: the ground alone. */
        if (boot.disguise) root.dataset.disguised = '';
        root.dataset.a11yTextSize = boot.a11yTextSizeBoost ? 'boost' : 'normal';
        root.dataset.a11yLegibility = boot.a11yLegibilityBoost ? 'boost' : 'normal';
        root.dataset.a11yMotion = boot.a11yMotionReduce || matchMedia('(prefers-reduced-motion: reduce)').matches
          ? 'reduce'
          : 'normal';
        /* The tab icon, which is the mark in the flag the person picked,
           and under disguise the neutral one instead. Set on
           every boot rather than only a disguised one: the document ships
           pointing at the default palette's file, so a person on any other
           flag would otherwise wear trans in the tab strip until the
           layout's effect ran.

           Disguise is the half of this that cannot wait for that effect:
           by then the flag icon has already been in the tab strip for as
           long as boot takes, and an install started in that window would
           have taken the app's real name with it. Both hrefs are derived
           from the links above rather than written out again, so the asset
           paths live in one place. */
        const icon = document.querySelector('link[rel="icon"]');
        icon.href = icon.href.replace(
          'favicon-trans.svg',
          'favicon-' + (boot.disguise ? 'notes' : boot.palette || 'trans') + '.svg'
        );
        const manifest = document.querySelector('link[rel="manifest"]');
        if (boot.disguise) {
          manifest.href = manifest.href.replace('manifest.webmanifest', 'manifest-notes.webmanifest');
          const touchIcon = document.querySelector('link[rel="apple-touch-icon"]');
          if (touchIcon) touchIcon.href = touchIcon.href.replace('apple-touch-icon.png', 'apple-touch-icon-notes.png');
        }
        const savedLocale = localStorage.getItem('PARAGLIDE_LOCALE');
        const locale = savedLocale === 'en' || savedLocale === 'pl' ? savedLocale : navigator.language;
        if (boot.disguise) document.title = locale.toLowerCase().startsWith('pl') ? 'Notatki' : 'Notes';
        if (locale.toLowerCase().startsWith('pl')) {
          manifest.href = manifest.href.replace('.webmanifest', '-pl.webmanifest');
        }
      } catch {
        /* no mirror yet, or storage is unavailable */
      }
      /* The build leaves the document's module hints inert (rel="x-modulepreload",
         src/hooks.server.ts) so the stylesheets a first paint waits for are not sharing the
         connection with ninety-eight modules nothing waits for. They are given back once
         the document has parsed and the first frame has had its turn. Outside the try
         above, so a browser with no storage still loads its modules.

         Over HTTP/1.1 there is no one connection to share: the browser opens six, and
         holding the hints only queued the modules behind the first frame, which put the
         first screen 0.3 s later. There each hint is given back as the parser adds it. Only
         HTTP/1.x is named, so a page with no protocol to read (the offline shell, the
         Android WebView) keeps the hold it always had. */
      {
        const give = () => {
          for (const link of document.querySelectorAll('link[rel="x-modulepreload"]')) link.rel = 'modulepreload';
        };
        const protocol = globalThis.performance?.getEntriesByType?.('navigation')[0]?.nextHopProtocol;
        if (protocol === 'http/1.1' || protocol === 'http/1.0') {
          const watch = new MutationObserver(give);
          watch.observe(document.documentElement, { childList: true, subtree: true });
          addEventListener('DOMContentLoaded', () => {
            watch.disconnect();
            give();
          });
        } else {
          addEventListener('DOMContentLoaded', () => requestAnimationFrame(() => setTimeout(give)));
        }
      }
    </script>
    <style>
      /* The first frame: the ground and the mark, painted from this document alone.
         Everything the app draws waits for its scripts, which on a slow phone is seconds,
         so until then the page was white. The theme and palette are the ones the script
         above has just stamped on <html>; the colours per palette are generated into the
         block below from palettes.css (npm run render:splash), and src/lib/theme/splash.ts
         says how.

         The mark never moves. The handover is opacity only, on the blind's soft ease-out:
         lib/splash.ts adds .is-leaving and .is-answered once boot has answered and its screen
         is showing, and takes the element out when the fade is done. It is fixed and inert,
         so nothing under it can be missed or blocked, and the ground is the app's own --bg
         so no frame of the fade shows a different one. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        pointer-events: none;
        background: var(--splash-ground, #f4f8fb);
        opacity: 0.996;
        /* The ground travels too: a disguised journal that opens without a gate trades the
           neutral notes palette for its own as boot answers, under this very element. */
        transition: opacity 280ms var(--ease-out-soft, cubic-bezier(0.38, 0.32, 0.2, 1)),
          background-color 280ms var(--ease-out-soft, cubic-bezier(0.38, 0.32, 0.2, 1));
      }
      #splash i {
        --s: 96px;
        display: block;
        box-sizing: border-box;
        width: var(--s);
        height: var(--s);
        border-radius: var(--splash-radius);
        background: radial-gradient(circle var(--s) at var(--splash-sun-x) var(--splash-sun-y), var(--splash-rings, var(--splash-tile), var(--splash-tile))), var(--splash-tile);
      }
      /* The tile's black edge, drawn the way mark.ts draws it: a stroke on
         the tile's own outline. It is also an element the browser counts as
         content, which is what lets the first frame be the page's first
         contentful paint and not only its first paint. */
      #splash svg { display: block; width: 100%; height: 100%; }
      #splash rect { stroke: var(--splash-ink); }
      #splash.is-leaving { opacity: 0; }
      html[data-disguised] #splash i { display: none; }
      /* Fade the app root in as the splash fades out on the same curve.
         The body keeps the ground opaque. lib/splash.ts marks leaving
         and removes it with the splash.

         Start at app opacity 0.004 and splash opacity 0.996 so Blink
         paints the app and warms the GPU before the fade. Keep app
         input disabled until leaving. */
      html[data-splash] [data-app-root] {
        opacity: 0.004;
        will-change: opacity;
      }
      html[data-splash=''] [data-app-root] {
        pointer-events: none;
      }
      /* The layout writes transition-property: none inline on the root, so
         a recovery conceals it in one frame. An inline declaration beats
         this rule unless it is important, and without that the root jumped
         to 1 in one frame and only the mark faded. */
      html[data-splash='leaving'] [data-app-root] {
        opacity: 1;
        transition: opacity 280ms var(--ease-out-soft, cubic-bezier(0.38, 0.32, 0.2, 1));
        transition-property: opacity !important;
      }
