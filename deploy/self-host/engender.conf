# Server blocks for a self-hosted engender origin on bare nginx (phase 13
# self-hosting ticket 01). deploy/SELF-HOSTING.md has the whole install.
#
# Install as /etc/nginx/sites-available/engender.conf, then enable it from
# sites-enabled. Four things need your values, each marked EDIT:
# the host name (twice), the two certificate paths and the root.
#
# Everything the app needs from its server - headers, CSP, caching, the SPA
# fallback - comes from the two snippets this includes, which are the ones
# production serves. Copy them in unchanged; a rule added here instead would
# be missing the next time they change.

server {
    listen 80;
    listen [::]:80;
    server_name journal.example.org;  # EDIT: your host name

    # The app needs a secure context, so plain HTTP is only a redirect.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name journal.example.org;  # EDIT: your host name

    # EDIT: your certificate. certbot will rewrite these two lines itself.
    ssl_certificate /etc/ssl/engender/fullchain.pem;
    ssl_certificate_key /etc/ssl/engender/privkey.pem;

    # EDIT: the unpacked release bundle, or the `current` symlink that
    # scripts/journal-release.mjs moves if you deploy with it.
    root /srv/engender/current;

    include snippets/engender-journal-site.conf;
}
