# The server block inside the self-hosting image (phase 13 self-hosting
# ticket 01). Plain HTTP on port 80, because TLS belongs to the reverse proxy
# in front of the container: the app will not start without a secure context,
# so something has to terminate HTTPS before a browser reaches this.
#
# The release bundle is mounted at /srv/engender rather than built into the
# image, so an update is a new directory and a restart, not a new image.

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /srv/engender;

    include snippets/engender-journal-site.conf;
}
