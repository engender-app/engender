# Install as snippets/engender-count-proxy.conf beside engender-page-count.conf.
access_log off;
error_log /dev/null;
client_max_body_size 1;

if ($request_method != POST) { return 405; }
if ($http_origin != $engender_count_origin) { return 403; }
if ($args != "") { return 400; }
if ($http_content_length !~ "^(0)?$") { return 400; }
if ($http_transfer_encoding != "") { return 400; }
if ($http_user_agent ~* "bot|crawl|spider|headless|curl|wget") { return 204; }

add_header Access-Control-Allow-Origin $engender_count_origin always;
add_header Cache-Control "no-store" always;

proxy_method GET;
proxy_pass_request_body off;
proxy_pass_request_headers off;
proxy_set_header Host stats.engender.barankiewicz.dev;
# Empty User-Agent is classified as a bot and retained before GC's privacy flags.
proxy_set_header User-Agent "Engender-count/1.0 anonymous";
proxy_hide_header Set-Cookie;
proxy_hide_header Access-Control-Allow-Origin;
proxy_connect_timeout 1s;
proxy_read_timeout 2s;
proxy_next_upstream off;
proxy_pass http://127.0.0.1:8081/gc/count?p=$engender_count_path;
