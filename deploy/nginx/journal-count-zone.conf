# Install as conf.d/engender-count-zone.conf: limit_req_zone is only valid in
# the http block, which Debian's nginx.conf opens around conf.d/*.conf.
#
# The Origin and User-Agent checks in engender-count-proxy.conf only stop
# browsers and honest bots. A script sets both headers freely, so without a
# rate it could post counts as fast as the network allows and fill the
# GoatCounter database. One visit sends one count per page, so twelve a minute
# per address with a burst of twenty is far above any person and leaves room
# for several people behind one carrier NAT. The address lives only in this
# shared-memory table; it is never logged.
limit_req_zone $binary_remote_addr zone=engender_count:1m rate=12r/m;
