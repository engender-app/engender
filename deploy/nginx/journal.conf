# Nginx server blocks for the production Journal origin.
# Install as /etc/nginx/sites-available/engender-journal.conf, then enable
# it from sites-enabled. certbot owns the certificate paths.

server {
    listen 80;
    listen [::]:80;
    server_name journal.engender.app;

    access_log off;
    error_log /var/log/nginx/engender/error.log warn;

    include snippets/engender-journal-http.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name journal.engender.app;

    access_log off;
    error_log /var/log/nginx/engender/error.log warn;

    # certbot-managed certificate for this exact origin.
    ssl_certificate /etc/letsencrypt/live/journal.engender.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/journal.engender.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The symlink this ticket's deploy/rollback command moves atomically.
    root /home/journal/current;

    include snippets/engender-journal-site.conf;
}
