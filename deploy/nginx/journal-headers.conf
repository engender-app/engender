# The response headers every location of the Journal origin sends
# (phase 2 ticket 05). Installed as
# /etc/nginx/snippets/engender-journal-headers.conf.
#
# Included per location rather than set once on the server, because nginx does
# not inherit add_header into a context that declares one of its own - and each
# location declares its own Cache-Control. A location that forgets this include
# is a location that answers without COEP, which for this app means the Journal
# will not open at all.

# SQLocal needs SharedArrayBuffer, which needs cross-origin isolation, which is
# these two. Nothing about them is visible until they are missing, at which
# point the OPFS VFS cannot install and the database never opens. The dev and
# preview servers set them in vite.config.ts; production is this file.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
# Same-origin responses pass the COEP check without this, so it is defence in
# depth: it also stops another site embedding these bytes as a subresource.
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Two years, and the apex already serves other things over HTTPS. No preload
# directive: that is a submission with a slow way back, and it would commit
# every sibling subdomain rather than this one.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
# frame-ancestors below says the same thing to anything from this decade.
add_header X-Frame-Options "DENY" always;
# A journal about someone's transition should not name itself in a Referer
# header, and there is nowhere for it to navigate off-origin anyway.
add_header Referrer-Policy "no-referrer" always;
# Everything the app does not use is switched off for every origin. Four
# features are the exception and they are `self` rather than absent: the two
# WebAuthn ones, where biometric access mode is a platform authenticator
# releasing the secret that wraps the data key (ticket 55), and camera and
# microphone, which video notes and the voice benchmark both open (phase 8
# ticket 01). An empty allowlist here would refuse all four on the deployed
# origin while they worked in dev, which is the sort of gap that ships.
# `self` is the default for all four, so this is stating the decision rather
# than widening anything.
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(self), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(self), midi=(), payment=(), publickey-credentials-create=(self), publickey-credentials-get=(self), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;

# The transport half of the CSP. The script half is a meta policy the build
# writes into the document, because only a build knows the hashes of the two
# inline scripts and this file is copied to the box by hand - see the note in
# svelte.config.js. Both are enforced and the browser applies the intersection,
# so script-src here is deliberately the wider of the two: narrowing it to
# 'self' would contradict the hashes and block the document's own scripts.
#
# Everything else is the whole list. connect-src 'self' is what makes an
# unexpected request to another origin fail rather than merely get noticed, and
# it is the same claim the release gate tests. blob: appears three times for
# three different reasons: photo thumbnails are decrypted into memory and shown
# through URL.createObjectURL, and a worker may be constructed from one.
#
# media-src is the third, and it covers two players. Ticket 24's voice notes
# feed a decrypted recording to an <audio> element through a blob URL, and
# ticket 27 previews a timelapse in a <video> the same way. Ticket 24 shipped
# without this and its playback was blocked here, which is the kind of thing
# only a deployed build shows: the Capacitor shell serves its own origin and
# never sees these headers, so Android was fine and the web app was not.
#
# blob: and nothing else. Neither player ever loads media from a URL, so an
# element reaching for one is a bug worth blocking rather than a case to allow.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'none'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' blob:" always;
