# HTTP responses for the production hostname. Install as
# /etc/nginx/snippets/engender-journal-http.conf.

# Renew certificates without writing into an immutable app release.
location ^~ /.well-known/acme-challenge/ {
    root /var/lib/letsencrypt;
    default_type text/plain;
    try_files $uri =404;
}

location / {
    return 301 https://$host$request_uri;
}
