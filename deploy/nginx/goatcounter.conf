# Install after issuing the certificate for this separate dashboard origin.
server {
    listen 80;
    listen [::]:80;
    server_name stats.engender.barankiewicz.dev;
    access_log off;
    error_log /var/log/nginx/engender/error.log warn;
    include snippets/engender-journal-http.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name stats.engender.barankiewicz.dev;
    access_log off;
    error_log /var/log/nginx/engender/error.log warn;

    ssl_certificate /etc/letsencrypt/live/stats.engender.barankiewicz.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stats.engender.barankiewicz.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/engender-goatcounter-dashboard.conf;
}
