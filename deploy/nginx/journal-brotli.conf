# Brotli for the text-typed assets (phase 5 performance ticket 01). Installed
# as /etc/nginx/snippets/engender-journal-brotli.conf, where the wildcard
# include in journal-site.conf picks it up.
#
# Kept out of that file because these directives come from ngx_brotli, which is
# not part of stock nginx: on a box without the module they are unknown
# directives, and nginx refuses to start rather than skipping them. So the file
# is installed only after the module is, and a box that has neither serves gzip
# and is otherwise identical. deploy/README.md has the order.
#
# The type list is the gzip one from journal-site.conf minus image/svg+xml,
# which is already tiny here, and both compressors may be on at once: a client
# that sends `Accept-Encoding: br` gets brotli, one that does not gets gzip.
brotli on;
brotli_vary on;
brotli_min_length 1024;
brotli_comp_level 5;
brotli_types text/plain text/css application/javascript application/json application/manifest+json application/wasm;
