# Install on stats.engender.barankiewicz.dev, never on the journal origin.
# Direct collection would bypass the two fixed, sanitised counting endpoints.
location ^~ /gc/count {
    access_log off;
    error_log /dev/null;
    return 404;
}

location = / {
    return 308 /gc/;
}

location = /gc {
    return 308 /gc/;
}

location /gc/ {
    access_log off;
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host stats.engender.barankiewicz.dev;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
}
