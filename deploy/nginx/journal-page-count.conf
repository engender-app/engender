# Install as snippets/engender-page-count.conf on the maintainer's VPS only.
# The browser sends no fields. Each endpoint chooses its own fixed counter.
location = /_stats/app {
    set $engender_count_path /app;
    set $engender_count_origin https://app.engender.barankiewicz.dev;
    include snippets/engender-count-proxy.conf;
}

location = /_stats/website {
    set $engender_count_path /website;
    set $engender_count_origin https://engender.barankiewicz.dev;
    include snippets/engender-count-proxy.conf;
}
