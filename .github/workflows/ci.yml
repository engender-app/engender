# Everything that has to be true before code lands.
#
# The release workflow calls this same file rather than repeating the list, so
# what a tag is verified against is what a change was verified against.
name: Checks

on:
  pull_request:
  # Verify main after integration as well as each pull request.
  push:
    branches: [main]
  workflow_call:

# No job here is given a secret. Nothing in it needs one, and a pull request
# from a fork must not be able to reach the signing credentials the release
# environment holds.
permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # For `-o pipefail`, which the default shell leaves off: the browser suites
    # are piped through tee, and a failure has to survive the pipe.
    shell: bash

jobs:
  node:
    name: Checks, Node tier, catalogues and licences
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Deep, with the tags, because release.yml calls this workflow against
          # a tag and a shallow checkout has none: app-version.mjs would resolve
          # a development version, svelte.config.js would leave the build id on
          # the clock, and these jobs would be verifying a build shaped
          # differently from the one that gets published.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # From the lockfile, so this installs what was committed rather than
      # whatever the registry offers today.
      - run: npm ci

      - name: Collect every Node check
        id: node-checks
        run: |
          mkdir -p ci-logs
          node scripts/run-ci-checks.mjs --tier node 2>&1 | tee ci-logs/node-checks.log
      - name: Report checks blocked by setup
        if: ${{ always() && steps.node-checks.outcome == 'skipped' }}
        run: |
          if [ -f scripts/run-ci-checks.mjs ]; then
            node scripts/run-ci-checks.mjs --tier node --blocked
          else
            echo 'BLOCKED all Node checks: repository checkout unavailable'
            exit 1
          fi
      - name: Keep Node check results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: node-logs-${{ github.run_id }}
          path: ci-logs/
          retention-days: 7
      # The other half of the dependency policy the spec asks of CI - no
      # Firebase, Play Services, analytics or proprietary runtime SDK in the
      # Android graph - runs in the Android job where Gradle can resolve the
      # release runtime classpath.
      #
      # `npm audit` advisory verdict, checked 2026-09-06, six open, none
      # reachable, nothing to patch - same two paths as the 2026-09-01
      # check, re-verified rather than assumed still true. A seventh,
      # @xmldom/xmldom (moderate, through @capacitor/cli -> plist), showed
      # up between the two checks and got closed with a plain
      # `npm audit fix`, since unlike the six below its fix wasn't a major
      # bump (phase 9 audit ticket 08):
      #   - cookie <0.7.0, low, arrives through @sveltejs/kit ->
      #     adapter-static. The advisory is about server-side cookie
      #     parsing; this app builds with adapter-static, has no server and
      #     no SSR.
      #   - uuid <11.1.1, moderate, arrives through xcode -> @capacitor/cli,
      #     which is developer tooling for Xcode project files and ships in
      #     no built artifact.
      # `npm audit fix --force` would install @sveltejs/kit@0.0.30 and break
      # the app for advisories neither reaches. Re-check this comment
      # against a fresh `npm audit` before re-running the fix, not after.

  android:
    name: Android debug artifact and F-Droid checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci

      - name: Collect every Android build check
        id: android-checks
        run: |
          mkdir -p ci-logs
          node scripts/run-ci-checks.mjs --tier android 2>&1 | tee ci-logs/android-checks.log
      - name: Report checks blocked by setup
        if: ${{ always() && steps.android-checks.outcome == 'skipped' }}
        run: |
          if [ -f scripts/run-ci-checks.mjs ]; then
            node scripts/run-ci-checks.mjs --tier android --blocked
          else
            echo 'BLOCKED all Android checks: repository checkout unavailable'
            exit 1
          fi

      - name: Keep PR debug APK
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          # Name cannot collide with the release APK the release workflow publishes.
          name: engender-android-debug-${{ github.run_id }}
          path: ci-logs/app-debug.apk
          retention-days: 7

      - name: Keep F-Droid rebuild report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fdroid-rebuild-report-${{ github.run_id }}
          path: ci-logs/
          retention-days: 30

  browser:
    name: Browser verification (${{ matrix.name }})
    runs-on: ubuntu-24.04
    # Each tier owns its build and journal. A failed walkthrough cannot skip
    # installed-PWA or nginx verification.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: browser-tier
            entry: tests/browser-tier/run.mjs
          - name: walkthrough-journal
            entry: tests/walkthrough.test.mjs
            args: --group journal
          - name: walkthrough-setup
            entry: tests/walkthrough.test.mjs
            args: --group setup
          - name: walkthrough-features
            entry: tests/walkthrough.test.mjs
            args: --group features
          - name: walkthrough-actions
            entry: tests/walkthrough.test.mjs
            args: --group actions
          - name: installed-pwa
            entry: tests/browser-tier/verify-build.mjs
          - name: hosting
            entry: tests/hosting/run.mjs
    steps:
      - uses: actions/checkout@v7
        with:
          # Deep, with the tags, because release.yml calls this workflow against
          # a tag and a shallow checkout has none: app-version.mjs would resolve
          # a development version, svelte.config.js would leave the build id on
          # the clock, and these jobs would be verifying a build shaped
          # differently from the one that gets published.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Browser fixture pages have no Paraglide Vite plugin. Compile before
      # the first request; the other tiers compile again as part of their build.
      - name: Compile message catalogues
        if: matrix.name == 'browser-tier'
        run: npx paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      - name: Sync browser fixtures
        if: matrix.name == 'browser-tier'
        run: npx svelte-kit sync

      # playwright-core ships no browser, and these tiers drive a real one
      # for OPFS, WASM SQLite and the service worker. Installing through the
      # pinned playwright-core gets the Chromium that version was built
      # against, rather than whatever the runner image happens to carry.
      - name: Chromium
        run: |
          npx playwright-core install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -e 'console.log(require("playwright-core").chromium.executablePath())')" >> "$GITHUB_ENV"

      # Every fixture these tiers drive is synthetic: the probe pages build
      # their own tables, and the walkthrough runs on the Alice demo persona.
      # Nothing in this job holds a real Journal, a key or a password, which is
      # what makes the logs safe to keep after a failure.
      - name: Build the verification bundle
        if: matrix.name != 'browser-tier'
        env:
          VITE_DEMO: ${{ startsWith(matrix.name, 'walkthrough-') && '1' || '0' }}
          ENGENDER_VERSION: ${{ startsWith(matrix.name, 'walkthrough-') && '9.9.9-walkthrough' || '' }}
        run: npm run build
      - name: Verify ${{ matrix.name }}
        id: browser-check
        run: |
          mkdir -p ci-logs
          node ${{ matrix.entry }} ${{ matrix.args }} 2>&1 | tee ci-logs/${{ matrix.name }}.log

      - name: Report verification blocked by setup
        if: ${{ always() && steps.browser-check.outcome == 'skipped' }}
        run: |
          echo 'BLOCKED ${{ matrix.name }}: prerequisite setup or build failed'
          echo 'BLOCKED ${{ matrix.name }}: prerequisite setup or build failed' >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Keep walkthrough timings and failed browser output
        if: ${{ always() && (startsWith(matrix.name, 'walkthrough-') || failure()) }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-${{ matrix.name }}-logs-${{ github.run_id }}
          path: ci-logs/
          retention-days: 7

  guards:
    name: Regression guards (${{ matrix.tier }} ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    # Separate hosted jobs isolate browser storage, fixtures and build outputs.
    # Duration estimates and build costs live in tests/guard-durations.json.
    timeout-minutes: ${{ matrix.tier == 'built' && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: dev
            shard: 1/3
          - tier: dev
            shard: 2/3
          - tier: dev
            shard: 3/3
          - tier: built
            shard: 1/6
          - tier: built
            shard: 2/6
          - tier: built
            shard: 3/6
          - tier: built
            shard: 4/6
          - tier: built
            shard: 5/6
          - tier: built
            shard: 6/6
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The same reason as the browser job's step of the same name: the dev
      # server these checks start has to find the compiled runtime on disk.
      - name: Compile message catalogues
        if: matrix.tier == 'dev'
        run: npx paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      # tsconfig.json extends .svelte-kit/tsconfig.json, which only exists
      # after a sync; without it the dev server cannot resolve its config.
      - name: Sync SvelteKit
        if: matrix.tier == 'dev'
        run: npx svelte-kit sync

      - name: Chromium
        run: |
          npx playwright-core install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -e 'console.log(require("playwright-core").chromium.executablePath())')" >> "$GITHUB_ENV"

      # Synthetic fixtures and the demo persona only, like the browser job,
      # so the logs are safe to keep.
      - name: Media fixture tools
        if: matrix.tier == 'built'
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg

      - name: Run every regression guard
        id: guard-checks
        run: |
          mkdir -p ci-logs
          node tests/run-guards.mjs --tier ${{ matrix.tier }} --shard ${{ matrix.shard }} 2>&1 | tee ci-logs/guards.log

      - name: Report guards blocked by setup
        if: ${{ always() && steps.guard-checks.outcome == 'skipped' }}
        run: |
          if [ -f tests/run-guards.mjs ]; then
            node tests/run-guards.mjs --tier ${{ matrix.tier }} --shard ${{ matrix.shard }} --blocked
          else
            echo 'BLOCKED regression guards: repository checkout unavailable'
            exit 1
          fi

      - name: Keep guard attempts, including recovered failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: guards-${{ matrix.tier }}-${{ strategy.job-index }}-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-logs/
          include-hidden-files: true
          retention-days: 7

  benchmark:
    name: Ten-year Journal, against the regression budget
    runs-on: ubuntu-24.04
    # Its own job rather than another step in the browser one. The run takes
    # 44 seconds and leaves 340MB in the origin's storage, and it gates on
    # timing rather than on correctness - so a wobble here should not turn
    # the correctness suite red, and its log should be retrievable on its
    # own. Running concurrently, it costs nothing in wall clock.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Chromium
        run: |
          npx playwright-core install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -e 'console.log(require("playwright-core").chromium.executablePath())')" >> "$GITHUB_ENV"

      # The fixture is generated from a seed, holds no real Journal and its
      # data key is the fixed probe one, so the log is safe to keep. What it
      # fails on is a measurement over budgets.json, set at five times the
      # recorded baseline: those numbers came off a quiet desktop and this
      # runner is slower by an unknown factor, so the gate is sized to catch
      # work that grew with the journal rather than a slow afternoon.
      - name: Long-Journal benchmark
        id: benchmark-check
        run: |
          mkdir -p ci-logs
          npm run benchmark:long-journal 2>&1 | tee ci-logs/long-journal.log

      - name: Report benchmark blocked by setup
        if: ${{ always() && steps.benchmark-check.outcome == 'skipped' }}
        run: |
          echo 'BLOCKED ten-year Journal benchmark: prerequisite setup failed'
          echo 'BLOCKED ten-year Journal benchmark: prerequisite setup failed' >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Keep the output of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: long-journal-log-${{ github.run_id }}
          path: ci-logs/
          retention-days: 7

  results:
    name: All required checks
    needs: [node, android, browser, guards, benchmark]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Report every required tier
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const jobs = JSON.parse(process.env.RESULTS);
          const lines = ['| Required tier | Result |', '| --- | --- |'];
          let failed = false;
          for (const [name, job] of Object.entries(jobs)) {
            lines.push(`| ${name} | ${job.result} |`);
            console.log(`${job.result === 'success' ? 'PASS' : 'FAIL'} ${name}: ${job.result}`);
            if (job.result !== 'success') failed = true;
          }
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          process.exitCode = failed ? 1 : 0;
          JS
