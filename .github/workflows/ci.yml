# Everything that has to be true before code lands.
#
# The release workflow calls this same file rather than repeating the list, so
# what a tag is verified against is what a change was verified against.
name: Checks

on:
  pull_request:
  # And main, because tickets here merge locally with `git merge --no-ff` and go
  # straight to main. A pull-request-only workflow would be watching a door
  # nobody uses.
  push:
    branches: [main]
  workflow_call:

# No job here is given a secret. Nothing in it needs one, and a pull request
# from a fork must not be able to reach the signing credentials the release
# environment holds.
permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # For `-o pipefail`, which the default shell leaves off: the browser suites
    # are piped through tee, and a failure has to survive the pipe.
    shell: bash

jobs:
  node:
    name: Checks, Node tier, catalogues and licences
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Deep, with the tags, because release.yml calls this workflow against
          # a tag and a shallow checkout has none: app-version.mjs would resolve
          # a development version, svelte.config.js would leave the build id on
          # the clock, and these jobs would be verifying a build shaped
          # differently from the one that gets published.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # From the lockfile, so this installs what was committed rather than
      # whatever the registry offers today.
      - run: npm ci

      # First, because svelte-check cannot resolve two imports until a build
      # writes them: paraglide's generated message runtime, and the list of
      # emitted client assets the service worker precaches. Neither is
      # committed. It is where a malformed catalogue fails, and the production
      # build check in its own right.
      - name: Production build
        run: npm run build
      - name: Svelte and TypeScript
        run: npm run check
      - name: Node tier
        run: npm test
      - name: Message catalogues and user-facing literals
        run: npm run check:copy
      - name: Dependency licences
        run: npm run check:licences
      - name: screens.css single-consumer classes
        run: npm run check:screens-classes
      # Reads the build the "Production build" step above already wrote -
      # every /_app/immutable URL build/index.html asks for, gzipped
      # (phase 9 audit ticket 01). No browser needed, so this job rather
      # than the browser tier's.
      - name: First-load budget
        run: npm run check:first-load-budget
      # The other half of the dependency policy the spec asks of CI - no
      # Firebase, Play Services, analytics or proprietary runtime SDK in the
      # Android graph - runs in the Android job where Gradle can resolve the
      # release runtime classpath.
      #
      # `npm audit` advisory verdict, checked 2026-09-06, six open, none
      # reachable, nothing to patch - same two paths as the 2026-09-01
      # check, re-verified rather than assumed still true. A seventh,
      # @xmldom/xmldom (moderate, through @capacitor/cli -> plist), showed
      # up between the two checks and got closed with a plain
      # `npm audit fix`, since unlike the six below its fix wasn't a major
      # bump (phase 9 audit ticket 08):
      #   - cookie <0.7.0, low, arrives through @sveltejs/kit ->
      #     adapter-static. The advisory is about server-side cookie
      #     parsing; this app builds with adapter-static, has no server and
      #     no SSR.
      #   - uuid <11.1.1, moderate, arrives through xcode -> @capacitor/cli,
      #     which is developer tooling for Xcode project files and ships in
      #     no built artifact.
      # `npm audit fix --force` would install @sveltejs/kit@0.0.30 and break
      # the app for advisories neither reaches. Re-check this comment
      # against a fresh `npm audit` before re-running the fix, not after.

  android:
    name: Android debug artifact and F-Droid checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci

      - name: Build web app and sync Android shell
        run: |
          npm run build
          npx cap sync android

      - name: Android dependency policy
        run: node scripts/check-android-dependencies.mjs

      - name: Build unsigned debug APK
        run: cd android && ./gradlew :app:assembleDebug

      - name: Keep PR debug APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          # Name cannot collide with the release APK the release workflow publishes.
          name: gender-diary-android-debug-${{ github.run_id }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: F-Droid rebuild attempt
        run: node scripts/fdroid-rebuild-report.mjs

      - name: Keep F-Droid rebuild report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fdroid-rebuild-report-${{ github.run_id }}
          path: ci-logs/fdroid-rebuild.md
          retention-days: 30

  browser:
    name: Browser tier, walkthroughs and the built app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Deep, with the tags, because release.yml calls this workflow against
          # a tag and a shallow checkout has none: app-version.mjs would resolve
          # a development version, svelte.config.js would leave the build id on
          # the clock, and these jobs would be verifying a build shaped
          # differently from the one that gets published.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # tests/browser-tier/browser-tier.vite.config.ts has no paraglideVitePlugin
      # of its own - it only serves probe pages over COOP/COEP and was never meant
      # to run a full app build - so every probe that imports $lib/paraglide/messages
      # needs the compiled runtime sitting on disk before this job's first request.
      # The Checks job gets that for free from its own "Production build" step
      # running first; this job never builds anything until "Walkthroughs" below,
      # one step too late for "Browser tier" above it, which failed on every probe
      # touching that import on every run until now (phase 9 audit ticket 12).
      - name: Compile message catalogues
        run: npx paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      # playwright-core ships no browser, and the three suites drive a real one
      # for OPFS, WASM SQLite and the service worker. Installing through the
      # pinned playwright-core gets the Chromium that version was built
      # against, rather than whatever the runner image happens to carry.
      - name: Chromium
        run: |
          npx playwright-core install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -e 'console.log(require("playwright-core").chromium.executablePath())')" >> "$GITHUB_ENV"

      # Every fixture these three drive is synthetic: the probe pages build
      # their own tables, and the walkthrough runs on the Alice demo persona.
      # Nothing in this job holds a real Journal, a key or a password, which is
      # what makes the logs safe to keep after a failure.
      - name: Browser tier
        run: |
          mkdir -p ci-logs
          npm run test:browser 2>&1 | tee ci-logs/browser-tier.log
      - name: Walkthroughs
        run: npm run test:walkthrough 2>&1 | tee ci-logs/walkthrough.log
      - name: Built app
        run: npm run verify:build 2>&1 | tee ci-logs/verify-build.log
      - name: Hosted origin (nginx)
        run: npm run verify:hosting 2>&1 | tee ci-logs/verify-hosting.log

      - name: Keep the output of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-logs-${{ github.run_id }}
          path: ci-logs/
          retention-days: 7

  benchmark:
    name: Ten-year Journal, against the regression budget
    runs-on: ubuntu-latest
    # Its own job rather than another step in the browser one. The run takes
    # 44 seconds and leaves 340MB in the origin's storage, and it gates on
    # timing rather than on correctness - so a wobble here should not turn
    # the correctness suite red, and its log should be retrievable on its
    # own. Running concurrently, it costs nothing in wall clock.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Chromium
        run: |
          npx playwright-core install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -e 'console.log(require("playwright-core").chromium.executablePath())')" >> "$GITHUB_ENV"

      # The fixture is generated from a seed, holds no real Journal and its
      # data key is the fixed probe one, so the log is safe to keep. What it
      # fails on is a measurement over budgets.json, set at five times the
      # recorded baseline: those numbers came off a quiet desktop and this
      # runner is slower by an unknown factor, so the gate is sized to catch
      # work that grew with the journal rather than a slow afternoon.
      - name: Long-Journal benchmark
        run: |
          mkdir -p ci-logs
          npm run benchmark:long-journal 2>&1 | tee ci-logs/long-journal.log

      - name: Keep the output of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: long-journal-log-${{ github.run_id }}
          path: ci-logs/
          retention-days: 7
