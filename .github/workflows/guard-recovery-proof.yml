name: Guard recovery proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel:
    name: Date picker wheel diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Chromium
        run: |
          npx playwright-core install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -e 'console.log(require("playwright-core").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Build demo
        run: VITE_DEMO=1 npm run build
      - name: Record trusted wheel events
        run: |
          mkdir -p ci-logs
          failed=0
          for attempt in 1 2 3 4 5; do
            node tests/date-picker-motion.mjs --gate --themes light 2>&1 | tee "ci-logs/date-picker-wheel-${attempt}.log" || failed=1
          done
          exit "$failed"
      - name: Keep diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: date-picker-wheel-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-logs/
          retention-days: 7
          if-no-files-found: error
