# A signed version tag becomes a GitHub Release.
#
# The tag is the only thing that names the release: this workflow reads it once
# through scripts/app-version.mjs and hands the same string to the notes, the
# bundle and the Android artifacts, through ENGENDER_VERSION. Nothing here
# re-derives a version.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # The same checks a pull request runs, against the tagged commit. A release
  # nobody verified is worse than a late release.
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Package and publish
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The protected environment. The Android signing credentials belong here,
    # and this is the only job that will ever be able to read them.
    environment: release
    # Secrets cannot appear directly in step conditions; expose only presence.
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      PLAY_UPLOAD_ENABLED: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The tag object itself, not just the commit: app-version.mjs asks
          # whether the tag carries a signature, and a shallow checkout has no
          # tag to ask about.
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Put Android signing tools on PATH
        run: |
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$build_tools/apksigner"
          test -x "$build_tools/zipalign"
          echo "$build_tools" >> "$GITHUB_PATH"

      - run: npm ci

      - name: Read the version from the signed tag, once
        id: version
        run: |
          # --release refuses a development version here, at the step that reads
          # the tag, rather than letting an unsigned tag get further in.
          version="$(node scripts/app-version.mjs --release)"
          [[ "$RELEASE_TAG" == "v$version" ]]
          git merge-base --is-ancestor HEAD origin/main
          echo "Releasing $version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          # Every later step, and every artifact, is handed this same string.
          echo "ENGENDER_VERSION=$version" >> "$GITHUB_ENV"

      # Before anything is built, so a tag cut without notes fails while
      # nothing has been published.
      - name: Release notes
        run: |
          mkdir -p dist
          node scripts/release-notes.mjs > dist/release-notes.md
          cat dist/release-notes.md

      - name: Derive Android version values from the same release version
        run: |
          mkdir -p dist
          node scripts/android-version.mjs "$ENGENDER_VERSION" > dist/android-version.env
          cat dist/android-version.env
          # android-version.mjs prints ANDROID_VERSION_CODE; build.gradle reads
          # ENGENDER_VERSION_CODE (ENGENDER_VERSION is already set from
          # the tag above, and matches ANDROID_VERSION_NAME by construction).
          version_code="$(grep '^ANDROID_VERSION_CODE=' dist/android-version.env | cut -d= -f2)"
          echo "ENGENDER_VERSION_CODE=$version_code" >> "$GITHUB_ENV"

      - name: Build unsigned Android release artifacts
        env:
          ANDROID_REQUIRE_RELEASE_VERSION: 'true'
        run: |
          npm run build
          npx cap sync android
          (cd android && ./gradlew :app:assembleRelease :app:bundleRelease --max-workers=2 --no-daemon)
          test -f android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f android/app/build/outputs/bundle/release/app-release.aab

      # Only native signing tools receive the key and passwords. The key is
      # removed before package-release.mjs runs its reproducibility builds.
      - name: Sign Android release artifacts
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
        run: |
          key="$RUNNER_TEMP/upload-keystore.p12"
          trap 'rm -f "$key" "$RUNNER_TEMP/aligned.apk"' EXIT
          umask 077
          base64 --decode <<<"$ANDROID_KEYSTORE_BASE64" > "$key"
          export ANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          mkdir -p dist/release
          zipalign -P 16 -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          apksigner sign --ks "$key" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --v4-signing-enabled false \
            --out "dist/release/engender-android-release-$ENGENDER_VERSION.apk" "$RUNNER_TEMP/aligned.apk"
          jarsigner -keystore "$key" -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -keypass:env ANDROID_KEY_PASSWORD \
            -signedjar "dist/release/engender-android-release-$ENGENDER_VERSION.aab" \
            android/app/build/outputs/bundle/release/app-release.aab "$ANDROID_KEY_ALIAS"

      - name: Build reproducible web and source packages with checksums
        run: node scripts/package-release.mjs

      - name: Verify complete release artifacts before publishing
        run: node scripts/check-release-artifacts.mjs

      # Publish all signed artifacts and checksums before contacting Play.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat dist/release-notes.md
            printf '\n## Checksums\n\n```\n'
            cat dist/release/SHA256SUMS
            printf '```\n'
          } > dist/release-body.md
          gh release create "$RELEASE_TAG" \
            --title "engender $ENGENDER_VERSION" \
            --notes-file dist/release-body.md \
            dist/release/*

      # First upload the AAB manually in Play Console. Keep drafts until the
      # account accepts automatic releases; then change status to completed.
      # Play failure leaves the published GitHub Release and job successful.
      - name: Upload App Bundle to Google Play internal
        if: env.PLAY_UPLOAD_ENABLED == 'true'
        continue-on-error: true
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.engender.app
          releaseFiles: dist/release/engender-android-release-${{ steps.version.outputs.value }}.aab
          track: internal
          status: draft
