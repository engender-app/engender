apply plugin: 'com.android.application'

def requireReleaseVersion = (System.getenv('ANDROID_REQUIRE_RELEASE_VERSION') ?: '').toBoolean()
def releaseVersionName = System.getenv('GENDER_DIARY_VERSION')?.trim() ?: '0.0.0-dev'
def releaseVersionCodeRaw = System.getenv('GENDER_DIARY_VERSION_CODE')?.trim() ?: '1'
def releaseVersionCode = (releaseVersionCodeRaw ==~ /^\d+$/) ? Integer.parseInt(releaseVersionCodeRaw) : 1
if (requireReleaseVersion && (releaseVersionName == '0.0.0-dev' || releaseVersionCode == 1)) {
    throw new GradleException('Release version variables are required: set GENDER_DIARY_VERSION and GENDER_DIARY_VERSION_CODE.')
}

def requireSigning = (System.getenv('ANDROID_REQUIRE_SIGNING') ?: '').toBoolean()
def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def keystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def keyAlias = System.getenv('ANDROID_KEY_ALIAS')
def keyPassword = System.getenv('ANDROID_KEY_PASSWORD') ?: keystorePassword
def hasReleaseSigning = keystorePath && keystorePassword && keyAlias && keyPassword
if (requireSigning && !hasReleaseSigning) {
    throw new GradleException(
        'Release signing is required but ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD are not all set.'
    )
}

android {
    namespace = "dev.barankiewicz.genderdiary"
    compileSdk = rootProject.ext.compileSdkVersion
    // Launch-route contract fixture (phase 5 deepening ticket 03, ADR-0028):
    // the JVM unit test reads the same launch-routes.json the TypeScript
    // test does, rather than a copy of it.
    sourceSets {
        test {
            resources.srcDirs += ['../../src/lib/android/fixtures']
        }
    }
    defaultConfig {
        applicationId "dev.barankiewicz.genderdiary"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode releaseVersionCode
        versionName releaseVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAlias
                keyPassword keyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // The journal's SQLite (ADR-0020). `implementation` rather than a test
    // dependency: libsqlcipher.so has to ship in the app APK, because the test
    // APK's native libraries are not on the app process's linker search path -
    // measured on API 35 in ticket 08's probe.
    implementation "net.zetetic:sqlcipher-android:$sqlcipherVersion@aar"
    implementation "androidx.sqlite:sqlite:$androidxSqliteVersion"
    // The prompt in front of the Keystore-wrapped data key (ticket 13,
    // ADR-0018). androidx rather than the framework's BiometricPrompt: the
    // app's floor is API 26 and the framework class arrived in 28, and only
    // androidx knows how to reach the device credential below API 30.
    implementation "androidx.biometric:biometric:$androidxBiometricVersion"
    // SAF tree/document operations for scheduled backup destinations.
    implementation "androidx.documentfile:documentfile:1.0.1"
    // WebMessageListener/ArrayBuffer transfer for the photo write channel
    // (ticket 19) - lets bytes cross into native as a structured clone
    // instead of a JSON string.
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    testImplementation "junit:junit:$junitVersion"
    // Host-side unit tests run against the Android SDK's stub jar, whose
    // org.json throws on every call. This puts the real implementation
    // ahead of the stub on the unit-test classpath so JSONObject usage
    // (ReminderPlannerTest, ReminderAlarmReceiverTest) can actually run.
    testImplementation "org.json:json:20231013"
    androidTestImplementation "androidx.test:runner:$androidxTestRunnerVersion"
    androidTestImplementation "androidx.test:core:$androidxTestCoreVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
